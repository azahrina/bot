<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>BOT TOLOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            width: 360px;
            margin: 0;
            padding: 15px;
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 4px 15px rgba(131, 58, 180, 0.3);
        }

        .logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #833ab4, #fd1d1d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .version {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            margin-top: 4px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .btn {
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #efefef;
            background: #fafafa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #fff;
            border-color: #833ab4;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(131, 58, 180, 0.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .btn-clear .btn-icon {
            background: #fee2e2;
            color: #ef4444;
        }

        .btn-tools .btn-icon {
            background: #fdf8ff;
            color: #833ab4;
        }

        .btn-text {
            flex: 1;
        }

        .btn-title {
            font-size: 14px;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        .btn-desc {
            font-size: 11px;
            color: #888;
        }

        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
            font-size: 10px;
            color: #bbb;
            font-weight: 500;
        }

        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #833ab4;
            color: white;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* STATUS CARD INDICATORS */
        .status-card {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
            height: 64px;
            box-sizing: border-box;
            outline: none;
        }

        .status-card .icon {
            font-size: 16px;
            filter: grayscale(100%);
            opacity: 0.4;
            transition: 0.3s;
        }

        .status-card .label {
            font-size: 8px;
            font-weight: 800;
            color: #94a3b8;
            text-align: center;
            line-height: 1;
            pointer-events: none;
        }

        /* ACTIVE / ON STATE */
        .status-card.active,
        .status-card:has(input:checked) {
            background: #ffffff;
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.3), inset 0 0 10px rgba(192, 132, 252, 0.05);
        }

        .status-card.active .icon,
        .status-card:has(input:checked) .icon {
            filter: grayscale(0%) drop-shadow(0 0 4px rgba(168, 85, 247, 0.6));
            opacity: 1;
        }

        .status-card.active .label,
        .status-card:has(input:checked) .label {
            color: #9333ea;
        }

        /* Hover effect for buttons */
        .status-card:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .status-card.active:hover {
            border-color: #a855f7;
            background: #fff;
        }

        /* NAV SYNC BOX */
        .nav-sync-box {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 12px;
            border: 1px dashed #e2e8f0;
        }

        #nav-sync-input {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        #nav-sync-input:focus {
            border-color: #833ab4;
            background: #fff;
        }

        #btn-nav-sync {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: transform 0.2s;
        }

        #btn-nav-sync:hover {
            transform: scale(1.05);
        }

        #btn-nav-sync:active {
            transform: scale(0.95);
        }

        /* QUICK URL CHIPS */
        .quick-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 700;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }

        .quick-chip:hover {
            border-color: #833ab4;
            color: #833ab4;
            background: #faf5ff;
            transform: translateY(-1px);
        }

        .quick-chip .chip-name {
            pointer-events: none;
        }

        .quick-chip .chip-del {
            font-size: 11px;
            color: #94a3b8;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 12px;
            cursor: pointer;
            line-height: 1;
            transition: all 0.15s;
        }

        .quick-chip .chip-del:hover {
            color: #ef4444;
            background: #fee2e2;
        }

        /* FEATURE VISIBILITY ITEM */
        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 5px 8px;
            cursor: pointer;
            user-select: none;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            transition: all 0.15s ease;
        }

        .feature-item:hover {
            border-color: #c084fc;
            background: #faf5ff;
        }

        .feature-item input {
            cursor: pointer;
            accent-color: #833ab4;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="header" style="margin-bottom:12px; display:flex; align-items:center; gap:10px; justify-content:center;">
        <div class="logo" style="width:30px; height:30px; margin:0; border-radius:8px;">
            <svg viewBox="0 0 24 24" style="width:18px; height:18px;">
                <path
                    d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />
            </svg>
        </div>
        <h1 style="font-size:15px; margin:0">BOT TOLOL</h1>
        <div class="version" style="font-size:9px; margin:0">v1.0.0</div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-main-view" style="display: block;">
        <div class="nav-sync-box" style="margin-bottom:8px;">
            <input type="text" id="nav-sync-input" placeholder="Paste link IG Profile/Post..." />
            <button id="btn-nav-sync" title="Sync all tabs to this link">🚀</button>
        </div>

        <!-- QUICK URL BUTTONS SECTION -->
        <div id="quick-urls-section" style="margin-bottom:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:8px 10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span style="font-size:9px; font-weight:800; color:#64748b; display:flex; align-items:center; gap:4px;">⚡ TOMBOL CEPAT URL</span>
                <span id="btn-toggle-add-url" style="font-size:9px; color:#833ab4; cursor:pointer; font-weight:700;">+ Tambah</span>
            </div>
            <!-- Quick URL Chips List -->
            <div id="quick-url-chips" style="display:flex; flex-wrap:wrap; gap:5px;"></div>
            <!-- Add URL Form (Hidden by default) -->
            <div id="quick-url-form" style="display:none; margin-top:8px; padding-top:8px; border-top:1px dashed #cbd5e1;">
                <input type="text" id="inp-quick-name" placeholder="Nama tombol (mis: Edit Profil)" style="width:100%; font-size:10px; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; box-sizing:border-box; margin-bottom:4px; outline:none;" />
                <input type="text" id="inp-quick-url" placeholder="URL IG (mis: https://instagram.com/accounts/edit/)" style="width:100%; font-size:10px; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; box-sizing:border-box; margin-bottom:6px; outline:none;" />
                <div style="display:flex; gap:6px;">
                    <button id="btn-save-quick-url" style="flex:1; background:linear-gradient(135deg, #833ab4, #fd1d1d); color:white; border:none; border-radius:6px; padding:6px; font-size:10px; font-weight:700; cursor:pointer;">Simpan</button>
                    <button id="btn-cancel-quick-url" style="background:#e2e8f0; color:#64748b; border:none; border-radius:6px; padding:6px 10px; font-size:10px; font-weight:700; cursor:pointer;">Batal</button>
                </div>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;">
            <!-- MOBILE ID -->
            <label class="status-card" for="mobile-id-toggle">
                <input type="checkbox" id="mobile-id-toggle" style="display:none">
                <span class="icon">🔴</span>
                <span class="label">AKTIFKAN</span>
            </label>

            <!-- FLOATING ICON -->
            <label class="status-card" for="floating-icon-toggle">
                <input type="checkbox" id="floating-icon-toggle" style="display:none">
                <span class="icon">🔘</span>
                <span class="label">QUICK ICON</span>
            </label>

            <!-- CLEAR DATA -->
            <button id="btn-clear" class="status-card">
                <span class="icon">🧹</span>
                <span class="label">CLEAR DATA</span>
            </button>

            <!-- TOOLS -->
            <button id="btn-tools" class="status-card">
                <span class="icon">🚀</span>
                <span class="label">PANEL</span>
                <div id="tools-lock"
                    style="position:absolute; inset:0; background:rgba(255,255,255,0.7); display:flex; align-items:center; justify-content:center; display:none; border-radius:12px;">
                    <span style="font-size:12px;">🔒</span>
                </div>
            </button>
        </div>

        <!-- PANEL FEATURE VISIBILITY SECTION -->
        <div id="features-edit-container"
            style="margin-top:12px; display:none; border:1px solid #e2e8f0; border-radius:12px; padding:12px; background:#f8fafc;">
            <div
                style="font-size:11px; font-weight:800; color:#64748b; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;">
                <span>🎛️ KELOLA MENU PANEL</span>
                <span id="btn-close-features" style="cursor:pointer; font-size:14px; padding: 2px 4px;">✕</span>
            </div>
            <div style="font-size:9px; color:#94a3b8; margin-bottom:8px;">Hilangkan centang untuk menyembunyikan menu dari sidebar panel:</div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px; gap:6px;">
                <button id="btn-select-all-features" style="flex:1; background:#e0e7ff; color:#4338ca; border:none; border-radius:6px; padding:4px 6px; font-size:9px; font-weight:700; cursor:pointer;">Centang Semua</button>
                <button id="btn-reset-features" style="flex:1; background:#fee2e2; color:#b91c1c; border:none; border-radius:6px; padding:4px 6px; font-size:9px; font-weight:700; cursor:pointer;">Reset Default</button>
            </div>
            <div id="features-checkbox-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px 6px; max-height:170px; overflow-y:auto; padding:2px;">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- PRESET EDIT SECTION -->
        <div id="preset-edit-container"
            style="margin-top:12px; display:none; border:1px solid #e2e8f0; border-radius:12px; padding:12px; background:#f8fafc;">
            <div
                style="font-size:11px; font-weight:800; color:#64748b; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                <span>⚙️ EDIT SHORTLINK PRESETS</span>
                <span id="btn-close-preset" style="cursor:pointer; font-size:14px; padding: 4px;">✕</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <div>
                    <label style="font-size:9px; font-weight:700; color:#94a3b8; display:block; margin-bottom:3px;">IMO
                        URL</label>
                    <input type="text" id="inp-imo" placeholder="https://..."
                        style="width:100%; font-size:11px; padding:8px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box; outline:none;">
                </div>
                <div>
                    <label
                        style="font-size:9px; font-weight:700; color:#94a3b8; display:block; margin-bottom:3px;">CLICKDEALER
                        URL</label>
                    <input type="text" id="inp-clickdealer" placeholder="https://..."
                        style="width:100%; font-size:11px; padding:8px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box; outline:none;">
                </div>
                <div>
                    <label
                        style="font-size:9px; font-weight:700; color:#94a3b8; display:block; margin-bottom:3px;">TRAFEE
                        URL</label>
                    <input type="text" id="inp-trafee" placeholder="https://..."
                        style="width:100%; font-size:11px; padding:8px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box; outline:none;">
                </div>
                <button id="btn-save-presets"
                    style="margin-top:4px; background:linear-gradient(135deg, #833ab4, #fd1d1d); color:white; border:none; border-radius:10px; padding:10px; font-size:11px; font-weight:700; cursor:pointer; transition: opacity 0.2s;">Simpan
                    Perubahan</button>
            </div>
        </div>

        <!-- Toggle Buttons for Settings -->
        <div style="display:flex; justify-content:center; gap:16px; margin-top:10px;">
            <span id="btn-toggle-features"
                style="font-size:10px; color:#833ab4; cursor:pointer; font-weight:700; text-decoration:none;">🎛️ Kelola Menu Panel</span>
            <span id="btn-toggle-preset"
                style="font-size:10px; color:#94a3b8; cursor:pointer; font-weight:600; text-decoration:none;">⚙️ Edit Presets</span>
        </div>
    </div> <!-- Close app-main-view -->

    <div class="footer" style="margin-top:12px; padding-top:8px; font-size:9px;">
        &copy; 2026 BOT TOLOL
    </div>

    <script src="index.js"></script>
</body>

</html>
